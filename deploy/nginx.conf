# Reverse proxy in front of the pm2-managed app (localhost:3000).
# Installed at /etc/nginx/sites-available/defi-api on the droplet,
# symlinked into sites-enabled/. Port 3000 stays firewalled off
# externally (ufw) — nginx is the only public entry point.

server {
    listen 80;
    listen [::]:80;

    server_name _;

    location / {
        proxy_pass       http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
