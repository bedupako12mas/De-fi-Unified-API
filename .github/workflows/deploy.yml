name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1
        with:
          host:     64.227.176.137
          username: root
          key:      ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd /root/De-fi-Unified-API
            git pull
            export PATH=/root/.nvm/versions/node/v24.18.0/bin:$PATH
            npm install
            pm2 restart defi-api
